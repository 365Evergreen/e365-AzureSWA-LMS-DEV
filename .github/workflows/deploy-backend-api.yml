name: Deploy Backend API

on:
  push:
    branches:
      - main
      - feature/project-setup
      - feature/create-assements
    paths:
      - services/backend-functions/**
      - .github/workflows/deploy-backend-api.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy backend API
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend functions
        run: pnpm run build:backend

      - name: Stage deployment package
        run: |
          rm -rf .deploy
          mkdir -p .deploy/dist
          cp services/backend-functions/host.json .deploy/
          cp -R services/backend-functions/dist/. .deploy/dist/

          node -e "const fs=require('fs'); const pkg=require('./services/backend-functions/package.json'); const out={name:pkg.name,version:pkg.version,main:pkg.main,dependencies:{'@azure/functions':pkg.dependencies['@azure/functions'],sharp:pkg.dependencies.sharp}}; fs.writeFileSync('./.deploy/package.json', JSON.stringify(out, null, 2));"

      - name: Install runtime dependencies for Linux
        working-directory: ./.deploy
        run: |
          npm install --omit=dev @azure/functions
          npm install --omit=dev --ignore-scripts sharp
          npm install --omit=dev @img/sharp-linux-x64 @img/sharp-libvips-linux-x64

      - name: Create deployment zip
        run: cd .deploy && zip -r ../deploy.zip .

      - name: Extract publish profile credentials
        id: creds
        run: |
          PROFILE='${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}'
          USER=$(echo "$PROFILE" | grep -oP '(?<=userName=")[^"]+')
          PASS=$(echo "$PROFILE" | grep -oP '(?<=userPWD=")[^"]+')
          echo "::add-mask::$PASS"
          echo "user=$USER" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT

      - name: Deploy zip via Kudu REST API
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            -u "${{ steps.creds.outputs.user }}:${{ steps.creds.outputs.pass }}" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            "https://${{ vars.AZURE_FUNCTIONS_APP_NAME }}.scm.azurewebsites.net/api/zipdeploy?isAsync=false")
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/deploy_response.txt || true
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Deployment failed with status $HTTP_STATUS"
            exit 1
          fi
