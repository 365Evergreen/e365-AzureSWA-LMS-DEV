name: Deploy Backend API

on:
  push:
    branches:
      - main
      - feature/project-setup
      - feature/create-assements
    paths:
      - services/backend-functions/**
      - .github/workflows/deploy-backend-api.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy backend API
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend functions
        run: pnpm run build:backend

      - name: Stage deployment package
        run: |
          rm -rf .deploy
          mkdir -p .deploy/dist
          cp services/backend-functions/host.json .deploy/
          cp -R services/backend-functions/dist/. .deploy/dist/

          node -e "const fs=require('fs'); const pkg=require('./services/backend-functions/package.json'); const out={name:pkg.name,version:pkg.version,main:pkg.main,dependencies:{'@azure/functions':pkg.dependencies['@azure/functions'],sharp:pkg.dependencies.sharp}}; fs.writeFileSync('./.deploy/package.json', JSON.stringify(out, null, 2));"

      - name: Install runtime dependencies for Linux
        working-directory: ./.deploy
        run: |
          npm install --omit=dev @azure/functions
          npm install --omit=dev --ignore-scripts sharp
          npm install --omit=dev @img/sharp-linux-x64 @img/sharp-libvips-linux-x64

      - name: Create deployment zip
        run: cd .deploy && zip -r ../deploy.zip .

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload zip to blob storage
        run: |
          BLOB_NAME="$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::8}.zip"
          az storage blob upload \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }} \
            --container-name function-releases \
            --name "$BLOB_NAME" \
            --file deploy.zip \
            --auth-mode login \
            --overwrite
          echo "BLOB_NAME=$BLOB_NAME" >> $GITHUB_ENV

      - name: Generate SAS URL and update app setting
        run: |
          EXPIRY=$(date -u -d "+10 years" +"%Y-%m-%dT%H:%M:%SZ")
          SAS_TOKEN=$(az storage blob generate-sas \
            --account-name ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }} \
            --container-name function-releases \
            --name "$BLOB_NAME" \
            --permissions r \
            --expiry "$EXPIRY" \
            --auth-mode login \
            --as-user \
            --https-only \
            -o tsv)
          BLOB_URL="https://${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}.blob.core.windows.net/function-releases/${BLOB_NAME}?${SAS_TOKEN}"
          az functionapp config appsettings set \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_FUNCTIONS_APP_NAME }} \
            --settings "WEBSITE_RUN_FROM_PACKAGE=${BLOB_URL}" \
            --output none
          echo "Deployed: $BLOB_NAME"
