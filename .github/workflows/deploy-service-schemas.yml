name: Deploy Schemas Service

on:
  push:
    branches:
      - main
      - feature/project-setup

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy schemas service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy schemas service
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file services/schemas/deploy.bicep \
              --parameters @services/schemas/deploy.parameters.json
