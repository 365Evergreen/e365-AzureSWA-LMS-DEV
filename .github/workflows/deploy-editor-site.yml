name: Deploy Editor Site

on:
  push:
    branches:
      - main
      - feature/project-setup

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy editor site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EDITOR_SITE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/editor-site
          output_location: build
