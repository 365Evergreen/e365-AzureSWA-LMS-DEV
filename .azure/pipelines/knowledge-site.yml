trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-knowledge-site/**
      - shared/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-knowledge-site/**
      - shared/**

pool:
  vmImage: ubuntu-latest

variables:
  - group: lms-swa-tokens   # SWA_TOKEN_KNOWLEDGE_SITE
  - group: lms-build-vars   # API_BASE_URL

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm ci
    displayName: 'Install workspace dependencies'

  - script: npm run build:knowledge
    displayName: 'Build knowledge site'
    env:
      VITE_API_BASE_URL: $(API_BASE_URL)

  - task: AzureStaticWebApp@0
    displayName: 'Deploy to Azure Static Web Apps'
    inputs:
      app_location: 'apps/lms-knowledge-site'
      output_location: 'dist'
      skip_app_build: true
      azure_static_web_apps_api_token: $(SWA_TOKEN_KNOWLEDGE_SITE)
