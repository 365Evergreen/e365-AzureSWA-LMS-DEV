trigger:
  branches:
    include:
      - feature/project-setup
  paths:
    include:
      - services/backend-functions/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - services/backend-functions/**

pool:
  name: 'LMS agent pool'

variables:
  - group: lms-azure-functions  # contains: AZURE_FUNCTIONS_APP_NAME, AZURE_SUBSCRIPTION_ID

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.npm
    displayName: 'Cache npm downloads'

  - script: |
      npm config set cache "$(Pipeline.Workspace)/.npm" --global
      npm ci
    displayName: 'Install workspace dependencies'

  - script: npm run build --workspace=services/backend-functions
    displayName: 'Build Azure Functions (esbuild)'

  - script: npm install --omit=dev --prefix services/backend-functions
    displayName: 'Install production dependencies'

  - task: AzureFunctionApp@2
    displayName: 'Deploy to Azure Functions'
    inputs:
      connectedServiceNameARM: 'lms-azure-service-connection'
      appType: functionApp
      appName: $(AZURE_FUNCTIONS_APP_NAME)
      package: 'services/backend-functions'
      deploymentMethod: zipDeploy
      appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false'
