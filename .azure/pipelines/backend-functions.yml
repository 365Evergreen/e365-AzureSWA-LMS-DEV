trigger:
  branches:
    include:
      - feature/project-setup
  paths:
    include:
      - services/backend-functions/**
      - .azure/pipelines/backend-functions.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - services/backend-functions/**

pool:
  name: 'LMS agent pool'

variables:
  - group: lms-azure-functions  # contains: AZURE_FUNCTIONS_APP_NAME, AZURE_SUBSCRIPTION_ID

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm install -g pnpm@10.27.0
    displayName: 'Install pnpm'

  - script: pnpm install --frozen-lockfile
    displayName: 'Install workspace dependencies'

  - script: pnpm run build:backend
    displayName: 'Build Azure Functions (esbuild)'

  - pwsh: |
      $stage = "$(Agent.TempDirectory)/func-deploy"
      Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force $stage | Out-Null

      # Copy build output and config
      Copy-Item services/backend-functions/host.json $stage/
      Copy-Item -Recurse services/backend-functions/dist $stage/

      # Write package.json with only the two runtime-external deps:
      #  - @azure/functions  (cannot be bundled; depends on host-injected @azure/functions-core)
      #  - sharp             (native binary; bundled separately for Linux below)
      $pkg = Get-Content services/backend-functions/package.json | ConvertFrom-Json
      @{
        name    = $pkg.name
        version = $pkg.version
        main    = $pkg.main
        dependencies = @{
          '@azure/functions' = $pkg.dependencies.'@azure/functions'
          sharp              = $pkg.dependencies.sharp
        }
      } | ConvertTo-Json -Depth 5 | Set-Content "$stage/package.json"

      Write-Host "Staged to $stage"
      Get-ChildItem $stage
    displayName: 'Stage deployment package'

  # Install runtime deps in the stage directory.
  # @azure/functions stays external (host provides @azure/functions-core at runtime).
  # sharp is external (native binary). We install --ignore-scripts to skip the Windows binary
  # download, then explicitly install the Linux x64 binary for the deployment target.
  - script: |
      cd "$(Agent.TempDirectory)/func-deploy"
      npm install @azure/functions
      npm install --ignore-scripts sharp
      npm install --force @img/sharp-linux-x64
    displayName: 'Install runtime dependencies for Linux'

  - task: AzureFunctionApp@2
    displayName: 'Deploy to Azure Functions'
    inputs:
      connectedServiceNameARM: 'lms-azure-service-connection'
      appType: functionAppLinux
      appName: $(AZURE_FUNCTIONS_APP_NAME)
      package: '$(Agent.TempDirectory)/func-deploy'
      deploymentMethod: zipDeploy
      appSettings: '-WEBSITE_RUN_FROM_PACKAGE 0 -SCM_DO_BUILD_DURING_DEPLOYMENT false -FUNCTIONS_WORKER_RUNTIME node'
