trigger:
  branches:
    include:
      - main
  paths:
    include:
      - services/backend-functions/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - services/backend-functions/**

pool:
  vmImage: ubuntu-latest

variables:
  - group: lms-azure-functions  # contains: AZURE_FUNCTIONS_APP_NAME, AZURE_SUBSCRIPTION_ID

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm ci --workspace=services/backend-functions
    displayName: 'Install function dependencies'

  - script: npm run build --workspace=services/backend-functions --if-present
    displayName: 'Build Azure Functions'

  - task: AzureFunctionApp@2
    displayName: 'Deploy to Azure Functions'
    inputs:
      connectedServiceNameARM: 'lms-azure-service-connection'
      appType: functionApp
      appName: $(AZURE_FUNCTIONS_APP_NAME)
      package: 'services/backend-functions'
      deploymentMethod: auto
