trigger:
  branches:
    include:
      - feature/project-setup
  paths:
    include:
      - services/backend-functions/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - services/backend-functions/**

pool:
  name: 'LMS agent pool'

variables:
  - group: lms-azure-functions  # contains: AZURE_FUNCTIONS_APP_NAME, AZURE_SUBSCRIPTION_ID

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.npm
    displayName: 'Cache npm downloads'

  - script: |
      npm ci --cache "$(Pipeline.Workspace)/.npm"
    displayName: 'Install workspace dependencies'

  - script: npm run build --workspace=services/backend-functions
    displayName: 'Build Azure Functions (esbuild)'

  - pwsh: |
      $stage = "$(Agent.TempDirectory)/func-deploy"
      Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force $stage | Out-Null

      # Copy build output and config
      Copy-Item services/backend-functions/host.json $stage/
      Copy-Item -Recurse services/backend-functions/dist $stage/

      # Write a minimal package.json with only true runtime deps (no workspace refs)
      $pkg = Get-Content services/backend-functions/package.json | ConvertFrom-Json
      @{
        name         = $pkg.name
        version      = $pkg.version
        main         = $pkg.main
        dependencies = $pkg.dependencies
      } | ConvertTo-Json -Depth 5 | Set-Content "$stage/package.json"

      Write-Host "Staged to $stage"
      Get-ChildItem $stage
    displayName: 'Stage deployment package'

  - script: npm install --omit=dev --prefer-offline --cache "$(Pipeline.Workspace)/.npm"
    workingDirectory: $(Agent.TempDirectory)/func-deploy
    displayName: 'Install production dependencies (isolated)'

  - task: AzureFunctionApp@2
    displayName: 'Deploy to Azure Functions'
    inputs:
      connectedServiceNameARM: 'lms-azure-service-connection'
      appType: functionApp
      appName: $(AZURE_FUNCTIONS_APP_NAME)
      package: '$(Agent.TempDirectory)/func-deploy'
      deploymentMethod: zipDeploy
      appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false -WEBSITE_RUN_FROM_PACKAGE 1'
