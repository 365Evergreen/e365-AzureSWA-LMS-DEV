trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-editorsite-dev/**
      - shared/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-editorsite-dev/**
      - shared/**

pool:
  name: 'LMS agent pool'

variables:
  - group: lms-swa-tokens   # SWA_TOKEN_EDITOR_APP
  - group: lms-build-vars   # ENTRA_TENANT_ID, ENTRA_CLIENT_ID_EDITOR, API_BASE_URL

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: npm | "$(Agent.OS)"
      path: node_modules
    displayName: 'Cache node_modules'

  - script: npm ci
    displayName: 'Install workspace dependencies'
    condition: ne(variables['CacheRestored'], 'true')

  - script: npm run build:editor
    displayName: 'Build editor app'
    env:
      VITE_ENTRA_CLIENT_ID: $(ENTRA_CLIENT_ID_EDITOR)
      VITE_ENTRA_TENANT_ID: $(ENTRA_TENANT_ID)
      VITE_API_BASE_URL: $(API_BASE_URL)

  - script: npx --yes @azure/static-web-apps-cli deploy apps/lms-editorsite-dev/dist --deployment-token $(SWA_TOKEN_EDITOR_APP) --env production
    displayName: 'Deploy to Azure Static Web Apps'
