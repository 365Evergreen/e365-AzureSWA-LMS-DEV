trigger:
  branches:
    include:
      - feature/project-setup
  paths:
    include:
      - apps/lms-editorsite-dev/**
      - shared/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-editorsite-dev/**
      - shared/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: lms-swa-tokens   # SWA_TOKEN_EDITOR_APP
  - group: lms-build-vars   # ENTRA_TENANT_ID, ENTRA_CLIENT_ID_EDITOR, API_BASE_URL

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm install -g pnpm@10.27.0
    displayName: 'Install pnpm'

  - script: pnpm install --frozen-lockfile
    displayName: 'Install workspace dependencies'

  - script: pnpm run build:editor
    displayName: 'Build editor app'
    env:
      VITE_ENTRA_CLIENT_ID: $(ENTRA_CLIENT_ID_EDITOR)
      VITE_ENTRA_TENANT_ID: $(ENTRA_TENANT_ID)
      VITE_API_BASE_URL: $(API_BASE_URL)
      VITE_API_SCOPE: $(API_SCOPE)

  - script: >
      npx --yes @azure/static-web-apps-cli deploy
      apps/lms-editorsite-dev/dist
      --swa-config-location apps/lms-editorsite-dev/public
      --deployment-token $(SWA_TOKEN_EDITOR_APP)
      --env production
    displayName: 'Deploy to Azure Static Web Apps'
