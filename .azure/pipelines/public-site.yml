trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-publicsite-dev/**
      - shared/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-publicsite-dev/**
      - shared/**

pool:
  name: 'LMS agent pool'

variables:
  - group: lms-swa-tokens   # SWA_TOKEN_PUBLIC_SITE
  - group: lms-build-vars   # API_BASE_URL

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm ci
    displayName: 'Install workspace dependencies'

  - script: npm run build:public
    displayName: 'Build public site'
    env:
      VITE_API_BASE_URL: $(API_BASE_URL)

  - task: AzureStaticWebApp@0
    displayName: 'Deploy to Azure Static Web Apps'
    inputs:
      app_location: 'apps/lms-publicsite-dev'
      output_location: 'dist'
      skip_app_build: true
      azure_static_web_apps_api_token: $(SWA_TOKEN_PUBLIC_SITE)
