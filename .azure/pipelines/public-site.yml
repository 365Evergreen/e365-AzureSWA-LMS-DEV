trigger:
  branches:
    include:
      - feature/project-setup
  paths:
    include:
      - apps/lms-publicsite-dev/**
      - shared/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-publicsite-dev/**
      - shared/**

pool:
  name: 'LMS agent pool'

variables:
  - group: lms-swa-tokens   # SWA_TOKEN_PUBLIC_SITE
  - group: lms-build-vars   # API_BASE_URL

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.npm
    displayName: 'Cache npm downloads'

  - script: |
      npm config set cache "$(Pipeline.Workspace)/.npm" --global
      npm ci
    displayName: 'Install workspace dependencies'

  - script: npm run build:public
    displayName: 'Build public site'
    env:
      VITE_API_BASE_URL: $(API_BASE_URL)

  - script: npx --yes @azure/static-web-apps-cli deploy apps/lms-publicsite-dev/dist --deployment-token $(SWA_TOKEN_PUBLIC_SITE) --env production
    displayName: 'Deploy to Azure Static Web Apps'
