trigger:
  branches:
    include:
      - feature/project-setup
  paths:
    include:
      - apps/lms-publicsite-dev/**
      - shared/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-publicsite-dev/**
      - shared/**

pool:
  name: 'lms-agent-pool'
  demands:
    - Agent.OS -equals Linux
    - Agent.Name -equals LMS agent pool

variables:
  - group: lms-swa-tokens   # SWA_TOKEN_PUBLIC_SITE
  - group: lms-build-vars   # API_BASE_URL

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm install -g pnpm@10.27.0
    displayName: 'Install pnpm'

  - script: pnpm install --frozen-lockfile
    displayName: 'Install workspace dependencies'

  - script: pnpm run build:public
    displayName: 'Build public site'
    env:
      VITE_API_BASE_URL: $(API_BASE_URL)

  - script: >
      npx --yes @azure/static-web-apps-cli deploy
      apps/lms-publicsite-dev/dist
      --swa-config-location apps/lms-publicsite-dev/public
      --deployment-token $(SWA_TOKEN_PUBLIC_SITE)
      --env production
    displayName: 'Deploy to Azure Static Web Apps'
