trigger:
  branches:
    include:
      - feature/project-setup
  paths:
    include:
      - apps/lms-learnersite-dev/**
      - shared/**
      - .azure/pipelines/learner-app.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-learnersite-dev/**
      - shared/**

pool:
  name: 'Default'
  demands:
    - Agent.OS -equals Linux
    - Agent.Name -equals LMS agent pool

variables:
  - group: lms-swa-tokens   # SWA_TOKEN_LEARNER_APP
  - group: lms-build-vars   # ENTRA_TENANT_ID, ENTRA_CLIENT_ID_LEARNER, API_BASE_URL, CDN_BASE_URL

steps:
  - checkout: self
    submodules: true

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm install -g pnpm@10.27.0
    displayName: 'Install pnpm'

  - script: pnpm install --frozen-lockfile
    displayName: 'Install dependencies'

  - task: AzureStaticWebApp@0
    displayName: 'Deploy learner app'
    env:
      NEXT_PUBLIC_ENTRA_CLIENT_ID: $(ENTRA_CLIENT_ID_LEARNER)
      NEXT_PUBLIC_ENTRA_TENANT_ID: $(ENTRA_TENANT_ID)
      NEXT_PUBLIC_API_BASE_URL: $(API_BASE_URL)
      NEXT_PUBLIC_CDN_BASE_URL: $(CDN_BASE_URL)
    inputs:
      app_location: 'apps/lms-learnersite-dev'
      output_location: ''
      config_file_location: 'apps/lms-learnersite-dev/public'
      app_build_command: 'pnpm --filter ./apps/lms-learnersite-dev build'
      skip_api_build: true
      azure_static_web_apps_api_token: $(SWA_TOKEN_LEARNER_APP)
      build_timeout_in_minutes: '30'
