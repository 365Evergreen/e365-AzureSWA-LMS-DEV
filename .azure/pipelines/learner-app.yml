trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-learnersite-dev/**
      - shared/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-learnersite-dev/**
      - shared/**

pool:
  vmImage: ubuntu-latest

variables:
  - group: lms-swa-tokens  # contains: SWA_TOKEN_LEARNER_APP

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm ci
    displayName: 'Install workspace dependencies'

  - script: npm run build:learner
    displayName: 'Build learner app (Next.js)'

  - task: AzureStaticWebApp@0
    displayName: 'Deploy to Azure Static Web Apps'
    inputs:
      app_location: 'apps/lms-learnersite-dev'
      output_location: '.next'
      skip_app_build: true
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: $(SWA_TOKEN_LEARNER_APP)
