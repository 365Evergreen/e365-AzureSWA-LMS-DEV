trigger:
  branches:
    include:
      - feature/project-setup
  paths:
    include:
      - apps/lms-learnersite-dev/**
      - shared/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - apps/lms-learnersite-dev/**
      - shared/**

pool:
  name: 'LMS agent pool'

variables:
  - group: lms-swa-tokens   # SWA_TOKEN_LEARNER_APP
  - group: lms-build-vars   # ENTRA_TENANT_ID, ENTRA_CLIENT_ID_LEARNER, API_BASE_URL, CDN_BASE_URL

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.npm
    displayName: 'Cache npm downloads'

  - script: |
      npm config set cache "$(Pipeline.Workspace)/.npm" --global
      npm ci
    displayName: 'Install workspace dependencies'

  - task: Cache@2
    inputs:
      key: 'nextjs | "$(Agent.OS)" | apps/lms-learnersite-dev/package.json'
      restoreKeys: nextjs | "$(Agent.OS)"
      path: apps/lms-learnersite-dev/.next/cache
    displayName: 'Cache Next.js build cache'

  - script: if exist apps\lms-learnersite-dev\.next\export rmdir /s /q apps\lms-learnersite-dev\.next\export
    displayName: 'Clean previous Next.js export (avoid Windows lock)'

  - script: npm run build:learner
    displayName: 'Build learner app (Next.js)'
    env:
      NEXT_PUBLIC_ENTRA_CLIENT_ID: $(ENTRA_CLIENT_ID_LEARNER)
      NEXT_PUBLIC_ENTRA_TENANT_ID: $(ENTRA_TENANT_ID)
      NEXT_PUBLIC_API_BASE_URL: $(API_BASE_URL)
      NEXT_PUBLIC_CDN_BASE_URL: $(CDN_BASE_URL)

  - script: npx --yes @azure/static-web-apps-cli deploy apps/lms-learnersite-dev/.next --deployment-token $(SWA_TOKEN_LEARNER_APP) --env production
    displayName: 'Deploy to Azure Static Web Apps'
